version: '3.8'

services:
  api-gateway:
    build: ./api-gateway
    ports:
      - "80:8080"
    environment:
      - PORT=8080
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - baseball-network
  # ...existing code for other services, with production overrides as needed...

networks:
  baseball-network:
    driver: bridge
